[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -q
    --strict-markers
    --tb=short
    -m "not live"
markers =
    unit: L1 纯函数单测（无 IO、无 MT5、无数据库，毫秒级）
    integration: L2 集成测试（可用内存 SQLite，不连 MT5）
    contract: L3 契约测试（校验新旧路径输出逐字段一致）
    live: L4 需要真实 MT5 连接，默认不跑（-m live 显式启用）
filterwarnings =
    ignore::DeprecationWarning
