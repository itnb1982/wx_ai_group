# ============================================================
# WanxiangAI - Alembic config (single entry for schema changes)
# ============================================================
# NOTE: keep this file PURE ASCII.
#   Alembic reads alembic.ini with encoding="locale" (GBK on Windows),
#   so any UTF-8 CJK comment here raises UnicodeDecodeError at startup.
#   Chinese design notes live in alembic/env.py instead (read as UTF-8).
#
# NOTE: sqlalchemy.url is intentionally NOT set here.
#   The real DB path is resolved by app.config.settings (reads .env) and
#   injected in alembic/env.py. Hardcoding a URL here risks running a
#   migration against the wrong database.
# ============================================================

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
